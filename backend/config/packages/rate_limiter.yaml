framework:
    rate_limiter:
        # Inscriptions : 5 comptes par heure et par adresse IP
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Codes d'invitation de groupe : 30 essais par heure et par utilisateur (anti-devinette)
        group_join:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Autocomplétion des villes (service gratuit Photon, à ménager) : 60 recherches par minute et par utilisateur
        # Images envoyées (profil, couvertures, lieux, groupes, articles) : 30 par heure et par utilisateur
        image_upload:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        geo_search:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
