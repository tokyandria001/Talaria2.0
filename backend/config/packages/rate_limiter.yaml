framework:
    rate_limiter:
        # Inscriptions : 5 comptes par heure et par adresse IP
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Codes d'invitation de groupe : 30 essais par heure et par utilisateur (anti-devinette)
        group_join:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
