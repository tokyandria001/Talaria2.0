name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Symfony) — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Même version de PHP que le VPS de production (Debian 12)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit de sécurité des dépendances
        run: composer audit

      - name: Clés JWT de test
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit --testdox

  frontend:
    name: Frontend (React) — lint et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
